<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<link rel="icon" href="assets/bojana.ico" type="image/x-icon">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher Manager — BTIS Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --blue:       #1a3a6b;
    --blue-mid:   #2257a8;
    --blue-light: #e8f0fb;
    --orange:     #e8620a;
    --yellow:     #f5a623;
    --white:      #ffffff;
    --muted:      #6b7280;
    --border:     #e2e8f0;
    --accent:     #059c52;
    --accent-bg:  #dcfce7;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: #fdf8f0;
    color: #1a3a6b;
    min-height: 100vh;
  }

  /* ── HEADER ── */
  header {
    background: var(--white);
    border-bottom: 3px solid var(--yellow);
    padding: 0 2.5rem;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 12px rgba(26,58,107,.08);
    position: sticky;
    top: 0;
    z-index: 50;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .back-btn {
    display: flex;
    align-items: center;
    gap: .5rem;
    font-size: .88rem;
    font-weight: 600;
    color: var(--blue);
    cursor: pointer;
    background: none;
    border: none;
    padding: .4rem .85rem;
    border-radius: 8px;
    transition: background .15s;
    text-decoration: none;
  }
  .back-btn:hover { 
    background: var(--blue-light); 
  }
  .back-btn .arrow { 
    font-size: 1rem; 
  }

  .divider-v {
    width: 1px;
    height: 28px;
    background: var(--border);
  }

  .page-title {
    display: flex;
    align-items: center;
    gap: .6rem;
    font-family: 'Eras Bold ITC', 'Eras ITC', 'Century Gothic', 'Gill Sans', 'Trebuchet MS', sans-serif;
    font-size: 1.05rem;
    font-weight: 700;
    font-style: italic;
    color: var(--blue);
  }

  .page-title .icon-wrap {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: var(--accent-bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
  }

  /* ── CONTENT ── */
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 4rem 2rem 6rem;
    text-align: center;
  }

  .coming-soon-wrap {
    animation: fadeUp .4s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .cs-icon-big {
    width: 96px;
    height: 96px;
    border-radius: 24px;
    background: var(--accent-bg);
    border: 2px solid #059c5222;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.8rem;
    margin: 0 auto 1.75rem;
  }

  .cs-title {
    font-family: 'Eras Bold ITC', 'Eras ITC', 'Century Gothic', 'Gill Sans', 'Trebuchet MS', sans-serif;
    font-size: 1.9rem;
    font-weight: 700;
    font-style: italic;
    color: var(--blue);
    margin-bottom: .6rem;
  }

  .cs-accent {
    color: var(--accent);
  }

  .cs-desc {
    font-size: .95rem;
    color: var(--muted);
    max-width: 460px;
    margin: 0 auto 2rem;
    line-height: 1.7;
  }

  .cs-badge {
    display: inline-flex;
    align-items: center;
    gap: .4rem;
    background: var(--accent-bg);
    color: var(--accent);
    border: 1.5px solid #059c5233;
    border-radius: 99px;
    padding: .45rem 1.1rem;
    font-size: .82rem;
    font-weight: 700;
    letter-spacing: .03em;
  }

  .cs-divider {
    width: 60px;
    height: 4px;
    background: var(--accent);
    border-radius: 2px;
    margin: 1.5rem auto;
    opacity: .7;
  }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: .45rem;
    margin-top: 2.5rem;
    padding: .65rem 1.4rem;
    background: var(--blue);
    color: #fff;
    border-radius: 10px;
    font-weight: 600;
    font-size: .9rem;
    text-decoration: none;
    transition: background .2s, transform .15s;
  }
  .back-link:hover { background: var(--blue-mid); transform: translateY(-2px); }

  footer {
    text-align: center;
    padding: 1.25rem 2rem;
    font-size: .76rem;
    color: var(--muted);
    border-top: 1px solid var(--border);
    background: var(--white);
  }
  footer strong { color: var(--blue); }

  /* ── Header right (lock) ── */
  .header-right { display:flex; align-items:center; gap:.6rem; }
  .lock-btn {
    background:#fff; border:1px solid var(--border); border-radius:9px;
    width:40px; height:40px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:17px; transition:.15s; flex-shrink:0;
  }
  .lock-btn:hover { background:var(--blue-light); border-color:#c7d9f5; }
  .lock-btn.locked-active { background:#fef3c7; border-color:#f5d9a0; }

  /* ── Tab nav ── */
  .tabs-bar {
    background:#fff; border-bottom:1px solid var(--border); padding:0 2rem;
    display:flex; gap:.1rem; overflow-x:auto; position:sticky; top:64px; z-index:40;
  }
  .tab-btn {
    display:flex; align-items:center; gap:.4rem; padding:.85rem 1.1rem; font-size:.875rem;
    font-weight:600; color:var(--muted); border:none; background:none; cursor:pointer;
    border-bottom:3px solid transparent; white-space:nowrap; font-family:inherit; transition:.15s;
  }
  .tab-btn:hover { color:var(--blue); }
  .tab-btn.on { color:var(--blue); border-bottom-color:var(--blue); }
  .tab-sec { display:none; }
  .tab-sec.on { display:block; }

  /* ── Teacher Duty ── */
  .td-main { max-width:900px; margin:0 auto; padding:1.75rem 1.25rem 5rem; text-align:left; }
  .td-head { margin-bottom:1.25rem; }
  .td-head h1 { font-size:1.4rem; font-weight:700; font-style:italic; color:var(--blue); font-family:'Eras Bold ITC','Century Gothic',sans-serif; }
  .td-head p { font-size:.88rem; color:var(--muted); margin-top:.25rem; }

  .view-banner {
    display:flex; align-items:center; gap:.5rem; background:#eff6ff; color:#1e40af;
    border:1px solid #bfdbfe; border-radius:10px; padding:.7rem 1rem; font-size:.82rem;
    font-weight:600; margin-bottom:1.25rem;
  }
  body:not(.locked) .view-banner { display:none; }

  .admin-only { display:block; }
  body.locked .admin-only { display:none !important; }

  .card {
    background:#fff; border:1px solid var(--border); border-radius:14px;
    padding:1.25rem; box-shadow:0 2px 10px rgba(26,58,107,.05); margin-bottom:1.25rem;
  }
  .card h3 { font-size:1rem; font-weight:700; color:var(--blue); margin-bottom:1rem; display:flex; align-items:center; gap:.5rem; }
  .fld { margin-bottom:.85rem; }
  .fld label { display:block; font-size:.78rem; font-weight:700; color:var(--blue); margin-bottom:.35rem; }
  .fi {
    width:100%; padding:.6rem .75rem; border:1.5px solid var(--border); border-radius:9px;
    font-family:inherit; font-size:.9rem; color:#1a3a6b; outline:none; background:#fff; transition:border-color .15s;
  }
  .fi:focus { border-color:var(--accent); }
  textarea.fi { resize:vertical; min-height:64px; }
  .file-drop {
    border:1.5px dashed #c7d9f5; border-radius:10px; padding:.9rem 1rem; text-align:center;
    font-size:.85rem; color:var(--muted); cursor:pointer; transition:.15s; background:#fafcff;
  }
  .file-drop:hover, .file-drop.drag { border-color:var(--accent); background:#f5fbf7; }
  .file-drop.drag { background:#eafaf0; }
  .file-drop.has-file { border-color:var(--accent); color:var(--accent); background:#f0fdf4; font-weight:600; }
  .btn {
    display:inline-flex; align-items:center; gap:.4rem; border:none; border-radius:9px;
    padding:.6rem 1.2rem; font-family:inherit; font-size:.88rem; font-weight:700; cursor:pointer; transition:.15s;
  }
  .btn-primary { background:var(--accent); color:#fff; }
  .btn-primary:hover { background:#047c43; }
  .btn-primary:disabled { opacity:.55; cursor:not-allowed; }
  .btn-ghost { background:#fff; border:1.5px solid var(--border); color:var(--blue); }
  .btn-ghost:hover { background:var(--blue-light); }

  /* ── Tabel dokumen ── */
  .td-table-wrap { overflow-x:auto; }
  .td-table { width:100%; border-collapse:collapse; font-size:.86rem; }
  .td-table thead th {
    text-align:left; font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.03em;
    color:var(--muted); padding:.6rem .7rem; border-bottom:2px solid var(--border); white-space:nowrap;
  }
  .td-table tbody td { padding:.75rem .7rem; border-bottom:1px solid var(--border); vertical-align:top; }
  .td-table tbody tr:last-child td { border-bottom:none; }
  .td-table tbody tr:hover { background:#fafcff; }
  .td-no { color:var(--muted); font-weight:700; text-align:center; }
  .dt-title { font-weight:700; color:var(--blue); }
  .dt-desc { font-size:.8rem; color:var(--muted); margin-top:.15rem; line-height:1.5; white-space:pre-wrap; }
  .dt-file { font-size:.72rem; color:#9ca3af; margin-top:.3rem; }
  .dt-date { color:var(--muted); white-space:nowrap; }
  .dt-act { display:flex; gap:.35rem; flex-wrap:nowrap; align-items:center; }
  .empty-docs { text-align:center; padding:3rem 1rem; color:var(--muted); }
  .empty-docs .ei { font-size:2.5rem; margin-bottom:.75rem; opacity:.5; }
  .icon-btn {
    border:1px solid var(--border); background:#fff; border-radius:8px; padding:.4rem .6rem;
    font-size:.8rem; font-weight:600; cursor:pointer; color:var(--blue); transition:.15s; text-decoration:none; display:inline-flex; align-items:center; gap:.3rem; white-space:nowrap;
  }
  .icon-btn:hover { background:var(--blue-light); }
  .icon-btn.danger { color:#dc2626; }
  .icon-btn.danger:hover { background:#fef2f2; }

  /* ── Modal (edit + lock) ── */
  .overlay {
    position:fixed; inset:0; background:rgba(15,23,42,.5); display:none; align-items:center;
    justify-content:center; z-index:100; padding:1rem;
  }
  .overlay.on { display:flex; }
  .modal { background:#fff; border-radius:16px; padding:1.5rem; width:100%; max-width:440px; box-shadow:0 20px 60px rgba(0,0,0,.25); }
  .modal h3 { font-size:1.1rem; font-weight:700; color:var(--blue); margin-bottom:1rem; }
  .modal .mfoot { display:flex; justify-content:flex-end; gap:.6rem; margin-top:1.25rem; }
  .form-msg { font-size:.8rem; margin-top:.5rem; min-height:1em; }
  .form-msg.err { color:#dc2626; }

  .toast {
    position:fixed; bottom:1.5rem; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--blue); color:#fff; padding:.7rem 1.3rem; border-radius:10px; font-size:.85rem;
    font-weight:600; opacity:0; pointer-events:none; transition:.25s; z-index:300;
  }
  .toast.show { 
    opacity:1; transform:translateX(-50%) translateY(0); }

  html, body { overflow-x: hidden; }
  @media (max-width:720px) {
    header { padding:0 .7rem; flex-wrap:wrap; gap:.4rem; }
    header .divider-v { display:none; }
    .page-title { font-size:.95rem; }
    .td-main { padding:1.25rem 1rem 4rem; }
    .card { padding:1rem; }
    /* Tabel → kartu bertumpuk (tanpa scroll nyamping) */
    .td-table-wrap { overflow:visible; }
    .td-table thead { display:none; }
    .td-table, .td-table tbody, .td-table tr, .td-table td { display:block; width:100%; }
    .td-table tr {
      border:1px solid var(--border); border-radius:12px; padding:.85rem 1rem;
      margin-bottom:.75rem; background:#fff; position:relative;
    }
    .td-table tbody tr:hover { background:#fff; }
    .td-table td { border:none !important; padding:.15rem 0; }
    .td-no {
      position:absolute; top:.7rem; right:.85rem; text-align:center;
      background:var(--blue-light); color:var(--blue); border-radius:6px;
      min-width:26px; padding:.1rem .4rem; font-size:.75rem;
    }
    .dt-title { padding-right:2.5rem; }
    .dt-date { margin-top:.35rem; font-size:.78rem; }
    .dt-date::before { content:'📅 '; }
    .dt-act { flex-wrap:wrap; margin-top:.65rem; gap:.4rem; }
    .dt-act .icon-btn { flex:1; min-width:calc(50% - .2rem); justify-content:center; padding:.5rem; }
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <a class="back-btn" href="index.html">
      <span class="arrow">←</span> Kembali
    </a>
    <div class="divider-v"></div>
    <div class="page-title">
      <div class="icon-wrap">👨‍🏫</div>
      Teacher Manager
    </div>
  </div>
  <div class="header-right">
    <button class="lock-btn" id="lock-btn" onclick="toggleLock()" title="Kunci / Buka Kunci (Admin)">🔓</button>
  </div>
</header>

<!-- ── TAB NAV ── -->
<div class="tabs-bar">
  <button class="tab-btn on" id="tab-duty" onclick="switchTab('duty')">📋 Teacher Duty</button>
</div>

<main class="td-main">
  <!-- ── TAB: Teacher Duty ── -->
  <section class="tab-sec on" id="sec-duty">
    <div class="td-head">
      <h1>📋 Teacher Duty</h1>
      <p>Dokumen tugas & piket guru.</p>
    </div>

    <!-- Form upload (admin) -->
    <div class="card admin-only">
      <h3>⬆️ Unggah Dokumen</h3>
      <div class="fld">
        <label>Judul <span style="color:#dc2626">*</span></label>
        <input class="fi" id="td-judul" placeholder="mis. Jadwal Piket Guru Semester 1">
      </div>
      <div class="fld">
        <label>Keterangan</label>
        <textarea class="fi" id="td-ket" placeholder="Keterangan singkat (opsional)"></textarea>
      </div>
      <div class="fld">
        <label>File (PDF / Word, maks 5MB) <span style="color:#dc2626">*</span></label>
        <div class="file-drop" id="td-drop" onclick="document.getElementById('td-file').click()">📎 Seret & lepas file ke sini, atau klik untuk pilih</div>
        <input type="file" id="td-file" accept=".pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document" style="display:none" onchange="onFilePick(this)">
      </div>
      <div class="form-msg" id="td-msg"></div>
      <button class="btn btn-primary" id="td-upload-btn" onclick="uploadDuty()">Unggah</button>
    </div>

    <!-- Daftar dokumen (semua orang) -->
    <div class="card">
      <h3>📄 Daftar Dokumen</h3>
      <div class="doc-list" id="doc-list"></div>
    </div>
  </section>

  <!-- Tambah tab baru di sini: <section class="tab-sec" id="sec-xxx">...</section>
       lalu tambahkan tombol <button class="tab-btn" onclick="switchTab('xxx')"> di .tabs-bar -->
</main>

<footer>
  <strong>BTIS Manager</strong> — School Management System
</footer>

<!-- Edit modal -->
<div class="overlay" id="editOverlay" onclick="if(event.target===this)closeEdit()">
  <div class="modal">
    <h3>✏️ Edit Dokumen</h3>
    <div class="fld"><label>Judul <span style="color:#dc2626">*</span></label><input class="fi" id="ed-judul"></div>
    <div class="fld"><label>Keterangan</label><textarea class="fi" id="ed-ket"></textarea></div>
    <div class="fld">
      <label>Ganti file (opsional)</label>
      <div class="file-drop" id="ed-drop" onclick="document.getElementById('ed-file').click()">📎 Biarkan kosong jika tidak ganti</div>
      <input type="file" id="ed-file" accept=".pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document" style="display:none" onchange="onEditFilePick(this)">
    </div>
    <div class="form-msg" id="ed-msg"></div>
    <div class="mfoot">
      <button class="btn btn-ghost" onclick="closeEdit()">Batal</button>
      <button class="btn btn-primary" onclick="saveEdit()">Simpan</button>
    </div>
  </div>
</div>

<!-- Lock modal -->
<div class="overlay" id="lockOverlay" onclick="if(event.target===this)closeLockModal()">
  <div class="modal" style="max-width:360px">
    <h3>🔑 Masuk Mode Admin</h3>
    <div class="fld"><label>Password Admin</label><input class="fi" type="password" id="lock-input" onkeydown="if(event.key==='Enter')doUnlock()"></div>
    <div class="form-msg" id="lock-msg"></div>
    <div class="mfoot">
      <button class="btn btn-ghost" onclick="closeLockModal()">Batal</button>
      <button class="btn btn-primary" onclick="doUnlock()">Masuk</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── Tab nav ──
function switchTab(name){
  document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('on'); });
  document.querySelectorAll('.tab-sec').forEach(function(s){ s.classList.remove('on'); });
  var btn=document.getElementById('tab-'+name); if(btn) btn.classList.add('on');
  var sec=document.getElementById('sec-'+name); if(sec) sec.classList.add('on');
}

// ── Auth & admin gate ──
var ADMIN_PIN = 'imron'; // fallback; di-update dari server
function _authHeaders(extra){
  var token=''; try{ token=localStorage.getItem('btis_token')||''; }catch(e){}
  return Object.assign({'Authorization':'Bearer '+token,'Content-Type':'application/json','Accept':'application/json'}, extra||{});
}
var LOCK_KEY='btis_teacher_locked';
var lockState={ locked:true };
function loadLockState(){ try{ var v=localStorage.getItem(LOCK_KEY); lockState.locked = v===null ? true : v==='1'; }catch(e){ lockState.locked=true; } }
function saveLockState(){ try{ localStorage.setItem(LOCK_KEY, lockState.locked?'1':'0'); }catch(e){} }
function applyLockState(){
  var btn=document.getElementById('lock-btn');
  if(lockState.locked){
    document.body.classList.add('locked');
    if(btn){ btn.textContent='🔒'; btn.title='Admin: klik untuk masuk mode edit'; btn.classList.add('locked-active'); }
  } else {
    document.body.classList.remove('locked');
    if(btn){ btn.textContent='🔓'; btn.title='Mode edit aktif — klik untuk mengunci'; btn.classList.remove('locked-active'); }
  }
}
function toggleLock(){
  if(lockState.locked){ openLockModal(); }
  else { lockState.locked=true; saveLockState(); applyLockState(); showToast('🔒 Dikunci'); }
}
function openLockModal(){ document.getElementById('lock-msg').textContent=''; document.getElementById('lock-input').value=''; document.getElementById('lockOverlay').classList.add('on'); setTimeout(function(){document.getElementById('lock-input').focus();},80); }
function closeLockModal(){ document.getElementById('lockOverlay').classList.remove('on'); }
function doUnlock(){
  var pin=document.getElementById('lock-input').value;
  var msg=document.getElementById('lock-msg');
  if(pin!==ADMIN_PIN){ msg.className='form-msg err'; msg.textContent='❌ Password salah.'; document.getElementById('lock-input').value=''; document.getElementById('lock-input').focus(); return; }
  lockState.locked=false; saveLockState(); applyLockState(); closeLockModal(); showToast('🔓 Mode admin aktif');
}

function showToast(txt){ var t=document.getElementById('toast'); t.textContent=txt; t.classList.add('show'); clearTimeout(t._to); t._to=setTimeout(function(){ t.classList.remove('show'); },2200); }
function escH(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtSize(b){ if(!b)return''; if(b<1024)return b+' B'; if(b<1048576)return (b/1024).toFixed(0)+' KB'; return (b/1048576).toFixed(1)+' MB'; }
function fmtDate(s){ if(!s)return''; try{ return new Date(s).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}); }catch(e){ return ''; } }

// ── File pick → validasi + base64 ──
var MAX_BYTES=5*1024*1024;
var MIME_OK=['application/pdf','application/msword','application/vnd.openxmlformats-officedocument.wordprocessingml.document'];
var pendingFile=null;   // {filename,mime,size,data} untuk form upload
var editFile=null;      // untuk modal edit
// Validasi + baca 1 File jadi base64 (dipakai oleh input pilih & drag-drop)
function handleFile(f, cb, msgEl, dropEl, inputEl){
  if(!f){ cb(null); return; }
  if(f.size>MAX_BYTES){ if(msgEl){msgEl.className='form-msg err';msgEl.textContent='❌ File melebihi 5MB.';} if(inputEl)inputEl.value=''; cb(null); return; }
  var okType = MIME_OK.indexOf(f.type)>=0 || /\.(pdf|docx?)$/i.test(f.name);
  if(!okType){ if(msgEl){msgEl.className='form-msg err';msgEl.textContent='❌ Hanya PDF atau Word.';} if(inputEl)inputEl.value=''; cb(null); return; }
  var reader=new FileReader();
  reader.onload=function(ev){
    var b64=String(ev.target.result).split(',')[1]||'';
    if(msgEl){ msgEl.className='form-msg'; msgEl.textContent=''; }
    if(dropEl){ dropEl.classList.add('has-file'); dropEl.textContent='📄 '+f.name+' ('+fmtSize(f.size)+')'; }
    cb({ filename:f.name, mime:f.type||'application/octet-stream', size:f.size, data:b64 });
  };
  reader.readAsDataURL(f);
}
function readFileTo(input, cb, msgEl, dropEl){ handleFile(input.files&&input.files[0], cb, msgEl, dropEl, input); }
function onFilePick(input){ readFileTo(input, function(res){ pendingFile=res; }, document.getElementById('td-msg'), document.getElementById('td-drop')); }
function onEditFilePick(input){ readFileTo(input, function(res){ editFile=res; }, document.getElementById('ed-msg'), document.getElementById('ed-drop')); }

// Pasang drag & drop pada sebuah drop zone
function wireDrop(dropId, inputId, onResult, msgId){
  var drop=document.getElementById(dropId); if(!drop)return;
  var input=document.getElementById(inputId), msg=document.getElementById(msgId);
  ['dragenter','dragover'].forEach(function(ev){ drop.addEventListener(ev,function(e){ e.preventDefault(); e.stopPropagation(); drop.classList.add('drag'); }); });
  ['dragleave','dragend','drop'].forEach(function(ev){ drop.addEventListener(ev,function(e){ e.preventDefault(); e.stopPropagation(); drop.classList.remove('drag'); }); });
  drop.addEventListener('drop',function(e){
    var f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];
    if(f) handleFile(f, onResult, msg, drop, input);
  });
}

// ── Render daftar ──
var docs=[];
function loadDocs(){
  fetch('/api/teacher/duty', { headers:_authHeaders() })
    .then(function(r){ return r.ok?r.json():null; })
    .then(function(j){ docs=(j&&j.data)||[]; renderDocs(); })
    .catch(function(){ renderDocs(); });
}
function renderDocs(){
  var el=document.getElementById('doc-list');
  if(!docs.length){ el.innerHTML='<div class="empty-docs"><div class="ei">📭</div><p>Belum ada dokumen.</p></div>'; return; }
  var rows=docs.map(function(d,i){
    var isPdf=(d.mime||'').indexOf('pdf')>=0;
    return '<tr>'+
      '<td class="td-no">'+(i+1)+'</td>'+
      '<td>'+
        '<div class="dt-title">'+(isPdf?'📕':'📘')+' '+escH(d.judul)+'</div>'+
        (d.keterangan?'<div class="dt-desc">'+escH(d.keterangan)+'</div>':'')+
        '<div class="dt-file">'+escH(d.filename)+(d.size?' • '+fmtSize(d.size):'')+'</div>'+
      '</td>'+
      '<td class="dt-date">'+fmtDate(d.created_at)+'</td>'+
      '<td class="dt-act">'+
        '<a class="icon-btn" href="/api/teacher/duty/'+d.id+'/download" target="_blank" rel="noopener">👁️ Lihat</a>'+
        '<a class="icon-btn" href="/api/teacher/duty/'+d.id+'/download?dl=1">⬇️ Unduh</a>'+
        '<button class="icon-btn admin-only" onclick="openEdit('+d.id+')">✏️ Edit</button>'+
        '<button class="icon-btn danger admin-only" onclick="delDoc('+d.id+')">🗑️ Hapus</button>'+
      '</td>'+
    '</tr>';
  }).join('');
  el.innerHTML='<div class="td-table-wrap"><table class="td-table">'+
    '<thead><tr><th style="width:44px">No</th><th>Dokumen</th><th style="width:110px">Tanggal</th><th style="white-space:nowrap">Aksi</th></tr></thead>'+
    '<tbody>'+rows+'</tbody></table></div>';
}

// ── Upload ──
function uploadDuty(){
  var judul=document.getElementById('td-judul').value.trim();
  var ket=document.getElementById('td-ket').value.trim();
  var msg=document.getElementById('td-msg');
  if(!judul){ msg.className='form-msg err'; msg.textContent='❌ Judul wajib diisi.'; return; }
  if(!pendingFile){ msg.className='form-msg err'; msg.textContent='❌ Pilih file dulu.'; return; }
  var btn=document.getElementById('td-upload-btn'); btn.disabled=true; btn.textContent='Mengunggah…';
  fetch('/api/teacher/duty', { method:'POST', headers:_authHeaders(), body:JSON.stringify(Object.assign({judul:judul,keterangan:ket}, pendingFile)) })
    .then(function(r){ return r.json(); })
    .then(function(j){
      btn.disabled=false; btn.textContent='Unggah';
      if(!j.success){ msg.className='form-msg err'; msg.textContent='❌ '+(j.message||'Gagal mengunggah'); return; }
      document.getElementById('td-judul').value=''; document.getElementById('td-ket').value='';
      document.getElementById('td-file').value=''; pendingFile=null;
      var drop=document.getElementById('td-drop'); drop.classList.remove('has-file'); drop.textContent='📎 Seret & lepas file ke sini, atau klik untuk pilih';
      msg.className='form-msg'; msg.textContent=''; showToast('✅ Dokumen diunggah'); loadDocs();
    })
    .catch(function(){ btn.disabled=false; btn.textContent='Unggah'; msg.className='form-msg err'; msg.textContent='❌ Gagal terhubung ke server.'; });
}

// ── Edit ──
var editId=null;
function openEdit(id){
  var d=docs.find(function(x){ return x.id===id; }); if(!d)return;
  editId=id; editFile=null;
  document.getElementById('ed-judul').value=d.judul||'';
  document.getElementById('ed-ket').value=d.keterangan||'';
  document.getElementById('ed-file').value='';
  document.getElementById('ed-msg').textContent='';
  var drop=document.getElementById('ed-drop'); drop.classList.remove('has-file'); drop.textContent='📎 Biarkan kosong jika tidak ganti';
  document.getElementById('editOverlay').classList.add('on');
}
function closeEdit(){ document.getElementById('editOverlay').classList.remove('on'); editId=null; editFile=null; }
function saveEdit(){
  if(editId==null)return;
  var judul=document.getElementById('ed-judul').value.trim();
  var ket=document.getElementById('ed-ket').value.trim();
  var msg=document.getElementById('ed-msg');
  if(!judul){ msg.className='form-msg err'; msg.textContent='❌ Judul wajib diisi.'; return; }
  var body={judul:judul, keterangan:ket};
  if(editFile) body=Object.assign(body, editFile);
  fetch('/api/teacher/duty/'+editId, { method:'PUT', headers:_authHeaders(), body:JSON.stringify(body) })
    .then(function(r){ return r.json(); })
    .then(function(j){ if(!j.success){ msg.className='form-msg err'; msg.textContent='❌ '+(j.message||'Gagal'); return; } closeEdit(); showToast('✅ Perubahan disimpan'); loadDocs(); })
    .catch(function(){ msg.className='form-msg err'; msg.textContent='❌ Gagal terhubung ke server.'; });
}

// ── Delete ──
function delDoc(id){
  var d=docs.find(function(x){ return x.id===id; });
  if(!confirm('Hapus dokumen "'+(d?d.judul:'')+'"?')) return;
  fetch('/api/teacher/duty/'+id, { method:'DELETE', headers:_authHeaders() })
    .then(function(r){ return r.json(); })
    .then(function(j){ if(j.success){ showToast('🗑️ Dokumen dihapus'); loadDocs(); } })
    .catch(function(){});
}

// ── Init ──
wireDrop('td-drop','td-file', function(res){ pendingFile=res; }, 'td-msg');
wireDrop('ed-drop','ed-file', function(res){ editFile=res; }, 'ed-msg');
loadLockState(); applyLockState();
fetch('/api/auth/lock-password', { headers:_authHeaders() })
  .then(function(r){ return r.ok?r.json():null; })
  .then(function(j){ if(j&&j.password) ADMIN_PIN=j.password; })
  .catch(function(){});
loadDocs();
</script>
